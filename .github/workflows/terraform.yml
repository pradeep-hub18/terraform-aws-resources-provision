name: Terraform AWS Resources

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.hcl"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      component:
        description: "Terraform component to run"
        required: true
        type: choice
        options:
          - networking
          - eks
          - eks-platform
          - edge-routing
          - nlb
          - ecr
      environment:
        description: "Terraform environment to run"
        required: true
        type: choice
        options:
          - DEV
          - STAGE
      action:
        description: "Terraform action to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
          - refresh

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.component }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  pr-validate:
    name: PR Terraform validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - networking
          - ecr
          - eks
          - edge-routing
          - eks-platform
          - nlb
        environment:
          - DEV
          - STAGE

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.component }}/environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  terraform:
    name: Terraform ${{ inputs.action }} - ${{ inputs.component }} - ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.component }}/environments/${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials with OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Configure AWS credentials with access keys
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config="backend.hcl"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy plan
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -lock=false

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -lock=false

      - name: Terraform refresh plan
        if: inputs.action == 'refresh'
        run: terraform plan -refresh-only -input=false 

      - name: Terraform refresh
        if: inputs.action == 'refresh'
        run: terraform apply -refresh-only -input=false -auto-approve
